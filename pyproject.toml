[project]
name = "harbor-rag-evals"
version = "0.1.0"
description = "Synthetic real-estate RAG assistant with a RAGAS evaluation gate."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Muhammad Mustafa" }]
keywords = ["rag", "ragas", "llm-evaluation", "proptech"]
dependencies = [
    "anthropic>=0.40",
    "faiss-cpu>=1.9",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, which
    # langchain-community 0.4 removed. Stay on the 0.3 line.
    "langchain-community>=0.3.31,<0.4",
    "numpy>=2.1",
    "openai>=1.50",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "ragas==0.4.3",
    "rapidfuzz>=3.9",
]

[project.scripts]
harbor-ask = "harbor_rag.cli:main"
harbor-eval = "harbor_rag.eval.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/harbor_rag"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
filterwarnings = [
    "ignore:Importing NonLLMContextRecall.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["harbor_rag"]
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "psycopg", "psycopg.*", "pgvector", "pgvector.*", "openai", "openai.*", "anthropic", "anthropic.*", "ragas", "ragas.*", "yaml"]
ignore_missing_imports = true
